name: 功能建议
description: 提议新的项目识别、分析规则或工作流改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述真实使用场景，而不只是期望的实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 项目证据或示例
      description: 可列出清单文件、目录结构或预期报告，禁止上传敏感源码。
  - type: textarea
    id: tradeoffs
    attributes:
      label: 误报、性能与兼容性风险
