name: 缺陷报告
description: 报告可复现的扫描、评分、界面或 CLI 问题
title: "[Bug] "
labels:
  - bug
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，确认没有相同问题
          required: true
        - label: 我已移除日志、截图和示例项目中的密钥及隐私数据
          required: true
  - type: dropdown
    id: surface
    attributes:
      label: 出现问题的位置
      options:
        - 网页项目导入
        - 扫描与评分
        - AI 解释
        - CLI
        - 报告导出
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 请说明导入类型、执行命令、点击路径和稳定复现步骤。
      placeholder: |
        1. 运行 ...
        2. 导入一个 ... 项目
        3. 打开 ...
        4. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Node.js、pnpm、浏览器和 CodeDoctor 版本。
      placeholder: macOS 15 / Node 22 / pnpm 9 / Chrome 版本号
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的证据
      description: 可附控制台错误、最小示例或截图；不要上传真实项目和 API Key。
